<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BNI TNT New Member Journey</title>
<meta name="theme-color" content="#C8102E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C8102E'/%3E%3Cpath d='M18 44l10-12 8 7 10-15' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --red:#C8102E; --red-d:#9e0c24; --ink:#1d1d1f; --ink2:#55565b; --ink3:#86878c;
  --bg:#f5f5f7; --card:#fff; --line:#e3e3e8; --soft:#fbeaec;
  --g:#1f9d55; --g-bg:#e6f5ec; --a:#c77700; --a-bg:#fff3de; --r:#d42a3c; --r-bg:#fde8ea; --n:#8a8b90; --n-bg:#efeff2;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red)}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;padding:10px 16px calc(10px);display:flex;align-items:center;gap:10px}
header.top .brand{font-weight:700;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .brand small{display:block;font-weight:500;opacity:.85;font-size:12px}
header.top select{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 8px;max-width:48vw}
header.top select option{color:#111}
header.top .out{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
nav.tabs{position:sticky;top:56px;z-index:19;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:none;border:0;padding:12px 14px;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:20px 0 8px}
.muted{color:var(--ink3)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--red-d)} .btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:#f2f2f4}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ok{background:var(--g)}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin:10px 0 4px;font-size:13px;font-weight:600;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.g{background:var(--g-bg);color:var(--g)} .pill.a{background:var(--a-bg);color:var(--a)} .pill.r{background:var(--r-bg);color:var(--r)} .pill.n{background:var(--n-bg);color:var(--n)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px}
.dot.green{background:var(--g)} .dot.amber{background:var(--a)} .dot.red{background:var(--r)} .dot.nodata{background:#c4c4c9}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1}
.kpi .l{font-size:12px;color:var(--ink3);margin-top:2px}
.bar{height:6px;background:#eee;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g)}
.mix{display:flex;height:10px;border-radius:9px;overflow:hidden;background:#eee}
.mix i{display:block;height:100%}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:14px}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{background:#fafafb;font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;margin-bottom:10px}
.task{display:flex;gap:10px;align-items:flex-start}
.task .who{font-weight:700}
.task .meta{font-size:13px;color:var(--ink2)}
.group-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:700}
.group-h .count{background:var(--ink);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px}
.group-h.over .count{background:var(--r)}
.owner-h{font-size:13px;font-weight:700;color:var(--ink2);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.3px}
.mcard{cursor:pointer}
.mcard:hover{border-color:#cfcfd6}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .it{position:relative;padding:8px 0}
.tl .it:before{content:"";position:absolute;left:-21px;top:13px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #c4c4c9}
.tl .it.done:before{background:var(--g);border-color:var(--g)}
.tl .it.over:before{border-color:var(--r)}
.tl .it.na:before{background:#c4c4c9}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.filters>*{flex:1 1 160px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 16px;border-radius:10px;z-index:100;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--r)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal-bg{align-items:center}}
.modal{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px 22px;max-height:92vh;overflow:auto}
@media (min-width:700px){.modal{border-radius:16px}}
.stars{display:flex;gap:6px}
.stars button{flex:1;padding:10px 0;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700;cursor:pointer}
.stars button.on{background:var(--red);color:#fff;border-color:var(--red)}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login .logo{width:56px;height:56px;border-radius:14px;background:var(--red);display:grid;place-items:center;margin-bottom:14px}
.flag{color:var(--r);font-weight:700}
.warn{background:var(--a-bg);border:1px solid #f1d49b;color:#6b4500;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.empty{padding:26px;text-align:center;color:var(--ink3)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:var(--red);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loginView" class="login hidden">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 64 64"><path d="M14 46l12-14 10 8 14-18" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h2 style="margin:0">New Member Journey</h2>
  <p class="muted" style="margin-top:4px">BNI TNT Region</p>
  <form id="loginForm" class="card">
    <label class="f" for="lu">Chapter username (or admin email)</label>
    <input id="lu" type="text" autocomplete="username" autocapitalize="none" placeholder="e.g. kanya" required>
    <label class="f" for="lp">Password</label>
    <input id="lp" type="password" autocomplete="current-password" required>
    <div style="margin-top:14px"><button class="btn" style="width:100%" type="submit">Log in</button></div>
    <p id="loginErr" class="small" style="color:var(--r);margin:10px 0 0"></p>
  </form>
</div>

<div id="appView" class="hidden">
  <header class="top">
    <div class="brand">New Member Journey<small id="whoami"></small></div>
    <select id="chapterSel" class="hidden" aria-label="Chapter"></select>
    <button class="out" id="logoutBtn">Log out</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"><div class="empty"><span class="spin"></span> Loading…</div></main>
</div>

<div id="modalRoot"></div>

<script src="vendor/supabase.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="lib/health.js"></script>
<script src="lib/palms.js"></script>
<script>
'use strict';
/* ======================= basics ======================= */
const DOMAIN = 'journey.bnitnt.in';
const S = { sb:null, session:null, profile:null, chapterSel:'all', tab:'week',
  chapters:[], members:[], tasks:[], palms:[], links:[], people:[], sdc:[], templates:[], config:{},
  filters:{ week:{owner:'', q:'', later:false}, members:{q:'', health:'', track:''} }, memberOpen:null };

const $ = (s, el=document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayISO(){ return new Date(Date.now() + 5.5*3600e3).toISOString().slice(0,10); }
function addDays(iso,n){ const t=new Date(iso+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5); }
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(iso){ if(!iso) return '-'; const [y,m,d]=String(iso).slice(0,10).split('-'); return `${+d} ${MON[+m-1]} ${y}`; }
function fmtS(iso){ if(!iso) return '-'; const [y,m,d]=String(iso).slice(0,10).split('-'); return `${+d} ${MON[+m-1]}`; }
function monthStart(iso){ return iso.slice(0,8)+'01'; }
function toast(msg, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), err?5000:2600); }
function goLive(){ return S.config.go_live_date || '2026-10-01'; }
const isAdmin = () => S.profile && S.profile.role === 'admin';
const chName = (id) => (S.chapters.find(c=>c.id===id)||{}).name || '';

/* ======================= data ======================= */
async function fetchAll(table, select, order, noId){
  const out=[];
  for(let from=0;;from+=1000){
    let q=S.sb.from(table).select(select).range(from, from+999);
    if(order) q=q.order(order);
    if(!noId) q=q.order('id', {ascending:true});
    const {data,error}=await q; if(error) throw error;
    out.push(...data); if(data.length<1000) break;
  }
  return out;
}
async function loadData(){
  const [chapters, cfg, templates] = await Promise.all([
    S.sb.from('chapters').select('*').order('name'),
    S.sb.from('app_config').select('*'),
    S.sb.from('task_templates').select('*').order('seq'),
  ]);
  for(const r of [chapters,cfg,templates]) if(r.error) throw r.error;
  S.chapters=chapters.data; S.templates=templates.data;
  S.config=Object.fromEntries(cfg.data.map(r=>[r.key,r.value]));
  const [members,tasks,palms,links,people,sdc]=await Promise.all([
    fetchAll('members','*','full_name'),
    fetchAll('tasks','*','due_date'),
    fetchAll('palms_rows','id,member_id,chapter_id,palms_name,p,a,l,m,s,rgi,rgo,rri,rro,one2one,upload_id,palms_uploads(period_from,period_to)'),
    fetchAll('palms_links','*','palms_name',true),
    fetchAll('chapter_people','*','name'),
    fetchAll('sdc_reviews','*','review_month'),
  ]);
  S.members=members; S.tasks=tasks; S.links=links; S.people=people; S.sdc=sdc;
  S.palms=palms.map(p=>({...p, period_from:p.palms_uploads?.period_from, period_to:p.palms_uploads?.period_to}));
  index();
}
function index(){
  S.tasksBy=new Map(); for(const t of S.tasks){ if(!S.tasksBy.has(t.member_id)) S.tasksBy.set(t.member_id,[]); S.tasksBy.get(t.member_id).push(t); }
  S.palmsBy=new Map(); for(const p of S.palms){ if(!p.member_id) continue; if(!S.palmsBy.has(p.member_id)) S.palmsBy.set(p.member_id,[]); S.palmsBy.get(p.member_id).push(p); }
  S.memberById=new Map(S.members.map(m=>[m.id,m]));
  S.healthCache=new Map();
}
function health(m){
  if(!S.healthCache.has(m.id)) S.healthCache.set(m.id, Health.computeHealth(m, S.tasksBy.get(m.id)||[], S.palmsBy.get(m.id)||[], todayISO()));
  return S.healthCache.get(m.id);
}
function scoped(list){ return S.chapterSel==='all' ? list : list.filter(x=>x.chapter_id===Number(S.chapterSel)); }
function activeMembers(){ return scoped(S.members).filter(m=>m.status==='active'); }
function track(m){ return m.induction_date && m.induction_date < goLive() ? 'B' : 'A'; }
function monthNo(m){ return m.induction_date ? Math.max(1, Math.floor(daysBetween(m.induction_date, todayISO())/30.44)+1) : 0; }
function ownerName(t, m){ return (t.owner_role==='Mentor' || t.owner_role==='Mentor + Head Table') && m && m.mentor_name ? `${t.owner_role}: ${m.mentor_name}` : t.owner_role; }
function completion(tasks, upTo){ const due=tasks.filter(t=>t.status!=='na' && t.due_date<=upTo); const done=due.filter(t=>t.status==='done').length; return {done, total:due.length, pct: due.length? Math.round(done*100/due.length) : null}; }
const LVL={green:'g',amber:'a',red:'r',nodata:'n'};
const LBL={green:'Green',amber:'Amber',red:'Red',nodata:'No data'};
function hpill(st){ return `<span class="pill ${LVL[st]}">${LBL[st]}</span>`; }

/* ======================= auth ======================= */
async function boot(){
  let cfg;
  try{ const r=await fetch('/api/config'); cfg=await r.json(); if(!r.ok) throw new Error(cfg.error||'config'); }
  catch(e){ document.body.innerHTML='<div class="login"><h2>Setup incomplete</h2><p>'+esc(e.message)+'</p></div>'; return; }
  S.sb=supabase.createClient(cfg.url, cfg.anonKey, {auth:{persistSession:true, autoRefreshToken:true}});
  const {data}=await S.sb.auth.getSession();
  if(data.session) await afterLogin(data.session); else showLogin();
}
function showLogin(){ $('#appView').classList.add('hidden'); $('#loginView').classList.remove('hidden'); }
$('#loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault(); $('#loginErr').textContent='';
  let u=$('#lu').value.trim().toLowerCase(); if(!u.includes('@')) u=`${u}@${DOMAIN}`;
  const {data,error}=await S.sb.auth.signInWithPassword({email:u, password:$('#lp').value});
  if(error){ $('#loginErr').textContent='Wrong username or password.'; return; }
  await afterLogin(data.session);
});
$('#logoutBtn').addEventListener('click', async ()=>{ await S.sb.auth.signOut(); location.reload(); });

async function afterLogin(session){
  S.session=session;
  const {data:prof,error}=await S.sb.from('profiles').select('*').eq('user_id', session.user.id).maybeSingle();
  if(error || !prof){ await S.sb.auth.signOut(); showLogin(); $('#loginErr').textContent='This login has no access yet. Ask the regional team.'; return; }
  S.profile=prof;
  $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden');
  try{ await loadData(); }catch(e){ $('#main').innerHTML='<div class="card">Could not load data: '+esc(e.message)+'</div>'; return; }
  if(isAdmin()){
    S.chapterSel = sessionStorageGet('chSel') || 'all';
    const sel=$('#chapterSel'); sel.classList.remove('hidden');
    sel.innerHTML='<option value="all">All chapters</option>'+S.chapters.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
    sel.value=S.chapterSel;
    sel.onchange=()=>{ S.chapterSel=sel.value; sessionStorageSet('chSel', sel.value); render(); };
    $('#whoami').textContent='Region admin · '+session.user.email;
    S.tab = sessionStorageGet('tab') || 'region';
  } else {
    S.chapterSel=String(prof.chapter_id);
    $('#whoami').textContent=chName(prof.chapter_id);
    S.tab = sessionStorageGet('tab') || 'week';
  }
  render();
}
function sessionStorageGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function sessionStorageSet(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }

/* ======================= shell ======================= */
function tabsList(){
  const t=[['week','This Week'],['members','Members'],['dash','Dashboard']];
  if(isAdmin()) t.unshift(['region','Region']);
  t.push(['settings', isAdmin()?'Leaders':'Settings']);
  if(isAdmin()) t.push(['admin','Admin']);
  return t;
}
function render(){
  const tabs=tabsList(); if(!tabs.some(x=>x[0]===S.tab)) S.tab=tabs[0][0];
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k&&!S.memberOpen?'on':''}">${l}</button>`).join('');
  const main=$('#main');
  if(S.memberOpen){ main.innerHTML=viewMember(S.memberOpen); window.scrollTo(0,0); return; }
  const v={week:viewWeek, members:viewMembers, dash:viewDash, region:viewRegion, settings:viewSettings, admin:viewAdmin}[S.tab];
  main.innerHTML=v();
  if(S.tab==='admin') adminAfterRender();
}
$('#tabs').addEventListener('click', e=>{ const b=e.target.closest('button[data-tab]'); if(!b) return; S.tab=b.dataset.tab; S.memberOpen=null; sessionStorageSet('tab',S.tab); render(); window.scrollTo(0,0); });

/* ======================= This Week ======================= */
function viewWeek(){
  const today=todayISO(), end=addDays(today,6), f=S.filters.week;
  const members=new Map(activeMembers().map(m=>[m.id,m]));
  let open=scoped(S.tasks).filter(t=>t.status==='open' && members.has(t.member_id));
  const owners=[...new Set(open.map(t=>ownerName(t, members.get(t.member_id))))].sort();
  if(f.owner) open=open.filter(t=>ownerName(t, members.get(t.member_id))===f.owner);
  if(f.q){ const q=f.q.toLowerCase(); open=open.filter(t=>members.get(t.member_id).full_name.toLowerCase().includes(q) || t.title.toLowerCase().includes(q)); }
  const over=open.filter(t=>t.due_date<today), week=open.filter(t=>t.due_date>=today && t.due_date<=end), later=open.filter(t=>t.due_date>end);
  const group=(list)=>{
    const by=new Map(); for(const t of list){ const k=ownerName(t, members.get(t.member_id)); if(!by.has(k)) by.set(k,[]); by.get(k).push(t); }
    return [...by.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,ts])=>`<div class="owner-h">${esc(k)} · ${ts.length}</div>`+ts.sort((a,b)=>a.due_date<b.due_date?-1:1).map(t=>taskCard(t, members.get(t.member_id))).join('')).join('');
  };
  return `
  <h2>This Week</h2>
  <p class="muted small" style="margin-top:-6px">${fmt(today)}${S.chapterSel==='all'?' · all chapters':' · '+esc(chName(Number(S.chapterSel)))}</p>
  <div class="filters">
    <select data-f="week.owner"><option value="">All owners</option>${owners.map(o=>`<option ${o===f.owner?'selected':''}>${esc(o)}</option>`).join('')}</select>
    <input type="text" data-f="week.q" placeholder="Search member or task" value="${esc(f.q)}">
  </div>
  <div class="group-h over">Overdue <span class="count">${over.length}</span></div>
  ${over.length?group(over):'<div class="card empty">Nothing overdue. 👏</div>'}
  <div class="group-h">Due this week <span class="count">${week.length}</span></div>
  ${week.length?group(week):'<div class="card empty">Nothing due in the next 7 days.</div>'}
  <div class="group-h">Coming later <span class="count">${later.length}</span>
    <button class="btn ghost sm" data-act="toggleLater">${f.later?'Hide':'Show'}</button></div>
  ${f.later?(later.length?group(later):'<div class="card empty">Nothing scheduled.</div>'):''}`;
}
function taskCard(t, m){
  const today=todayISO(); const late=t.due_date<today ? daysBetween(t.due_date,today) : 0;
  return `<div class="card task">
    <div class="grow">
      <div><a href="#" data-act="openMember" data-id="${m.id}" class="who" style="color:inherit;text-decoration:none">${esc(m.full_name)}</a>
        ${S.chapterSel==='all'?`<span class="muted small"> · ${esc(chName(m.chapter_id))}</span>`:''}</div>
      <div>${esc(t.title)}${t.is_catchup?' <span class="pill n">catch-up</span>':''}</div>
      <div class="meta">Due ${fmtS(t.due_date)}${late?` · <span class="flag">${late} day${late>1?'s':''} late</span>`:''}</div>
    </div>
    <div class="row" style="flex-direction:column;align-items:stretch;gap:6px">
      <button class="btn sm ok" data-act="done" data-id="${t.id}">Done</button>

async function saveMentors(btn){
  const changes=[];
  document.querySelectorAll('input[data-mentor]').forEach(inp=>{ const id=Number(inp.dataset.mentor); const m=S.memberById.get(id);
    const name=inp.value.trim()||null; const mob=(document.querySelector(`input[data-mmob="${id}"]`).value.trim())||null;
    if(name!==(m.mentor_name||null) || mob!==(m.mentor_mobile||null)) changes.push({id, mentor_name:name, mentor_mobile:mob}); });
  if(!changes.length) return toast('Nothing changed');
  btn.disabled=true; btn.textContent='Saving '+changes.length+'…';

}

/* ======================= Region ======================= */
function monthCompletion(chId, ms){
  const me=addDays(monthStart(addDays(ms,32)),-1);
  const ts=S.tasks.filter(t=>t.chapter_id===chId && t.status!=='na' && t.due_date>=ms && t.due_date<=me && S.memberById.get(t.member_id)?.status==='active');
  const done=ts.filter(t=>t.status==='done').length; return ts.length?Math.round(done*100/ts.length):null;
}
function viewRegion(){
  const today=todayISO(), m1=monthStart(addDays(monthStart(today),-1)), m2=monthStart(addDays(m1,-1));
  const rows=S.chapters.map(ch=>{
    const mem=S.members.filter(m=>m.chapter_id===ch.id&&m.status==='active'); const ids=new Set(mem.map(m=>m.id));
    const ts=S.tasks.filter(t=>ids.has(t.member_id)); const hc={green:0,amber:0,red:0,nodata:0}; mem.forEach(m=>hc[health(m).status]++);
    const p1=monthCompletion(ch.id,m1), p2=monthCompletion(ch.id,m2);
    return {ch, n:mem.length, hc, now:completion(ts,today).pct, p1, p2, over:ts.filter(t=>t.status==='open'&&t.due_date<today).length,

  const reds=S.members.filter(m=>m.status==='active'&&health(m).status==='red');

  const renewed=matured.filter(m=>m.status==='renewed').length;

  return `<h2>Region Dashboard</h2>

  ${rows.map(r=>`<tr><td><a href="#" data-act="pickChapter" data-id="${r.ch.id}">${esc(r.ch.name.replace(/^BNI /,''))}</a>${r.flag?'<div class="flag small">Below 70% two months: SDC meets ED</div>':''}</td>

      <div class="small muted">${r.hc.red} red · ${r.hc.amber} amber</div></td>
    <td class="num">${r.now===null?'-':r.now+'%'}</td><td class="num ${r.p1!==null&&r.p1<70?'flag':''}">${r.p1===null?'-':r.p1+'%'}</td><td class="num ${r.p2!==null&&r.p2<70?'flag':''}">${r.p2===null?'-':r.p2+'%'}</td>
    <td class="num">${r.over}</td><td>${r.reviewed?'<span class="pill g">Yes</span>':'<span class="pill r">No</span>'}</td></tr>`).join('')}

async function api(path, body){
  const {data}=await S.sb.auth.getSession();
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:JSON.stringify(body||{})});

/* ---- import members ---- */
let IMPORT=null;
function readSheet(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ try{ const wb=XLSX.read(fr.result,{type:'array',cellDates:false}); res(wb);}catch(e){rej(e);} }; fr.onerror=rej; fr.readAsArrayBuffer(file); });
}
async function onImportFile(e){
  const file=e.target.files[0]; if(!file) return;
  const box=$('#impPreview'); box.innerHTML='<span class="spin"></span>';
  try{
    const wb=await readSheet(file);
    const ws=wb.Sheets['Members']||wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    const hdr=rows[0].map(h=>String(h).trim().toLowerCase()); const col=(n)=>hdr.indexOf(n);
    const need=['member name','chapter']; for(const n of need) if(col(n)<0) throw new Error('Missing column "'+n+'" in the first row');
    const g=(r,n)=>{ const i=col(n); return i<0?'':r[i]; };
    const existing=new Set(S.members.map(m=>m.chapter_id+'|'+Palms.norm(m.full_name)));
    const out=[]; const errs=[]; const seen=new Set();
    rows.slice(1).forEach((r,i)=>{
      const name=String(g(r,'member name')).trim(); if(!name || /^example/i.test(name)) return;
      const chRaw=String(g(r,'chapter')).trim(); const ch=S.chapters.find(c=>Palms.norm(c.name)===Palms.norm(chRaw)||Palms.norm(c.name)===Palms.norm('bni '+chRaw));
      const row={full_name:name, chapter_id:ch?ch.id:null, category:String(g(r,'business category')).trim()||null, company:String(g(r,'company name')).trim()||null,
        mobile:String(g(r,'mobile')).trim()||null, payment_date:Palms.toISO(g(r,'payment date')), induction_date:Palms.toISO(g(r,'induction date')),
        mentor_name:String(g(r,'personal mentor')).trim()||null, mentor_mobile:String(g(r,'mentor mobile')).trim()||null, power_team:String(g(r,'power team')).trim()||null, notes:String(g(r,'notes')).trim()||null};
      const line=i+2; const probs=[];
      if(!ch) probs.push('unknown chapter "'+chRaw+'"');
      if(g(r,'payment date')!=='' && !row.payment_date) probs.push('bad payment date');
      if(g(r,'induction date')!=='' && !row.induction_date) probs.push('bad induction date');
      if(!row.payment_date && !row.induction_date) probs.push('needs an induction or payment date');
      if(row.induction_date && row.induction_date < addDays(goLive(),-365)) probs.push('inducted '+fmt(row.induction_date)+', more than 12 months before go-live, so not a first-year member');
      const key=row.chapter_id+'|'+Palms.norm(name);
      row._dup = existing.has(key) || seen.has(key); seen.add(key);
      if(probs.length) errs.push('Row '+line+' ('+name+'): '+probs.join(', ')); else out.push(row);
    });
    IMPORT=out.filter(r=>!r._dup);
    const dups=out.length-IMPORT.length;
    box.innerHTML=`<div style="margin-top:10px">
      ${errs.length?`<div class="warn"><b>${errs.length} row(s) need fixing</b> (they will be skipped):<br>${errs.map(esc).join('<br>')}</div>`:''}
      <p><b>${IMPORT.length}</b> new member(s) ready${dups?`, <b>${dups}</b> already in the app (skipped)`:''}.
      Track A: ${IMPORT.filter(r=>!r.induction_date||r.induction_date>=goLive()).length} · Track B: ${IMPORT.filter(r=>r.induction_date&&r.induction_date<goLive()).length}</p>
      ${IMPORT.length?`<div class="tw"><table class="t"><thead><tr><th>Name</th><th>Chapter</th><th>Induction</th><th>Mentor</th></tr></thead><tbody>${IMPORT.slice(0,200).map(r=>`<tr><td>${esc(r.full_name)}</td><td>${esc(chName(r.chapter_id))}</td><td>${fmt(r.induction_date)}</td><td>${esc(r.mentor_name||'')}</td></tr>`).join('')}</tbody></table></div>
      <button class="btn" data-act="doImport">Import ${IMPORT.length} member(s)</button>`:''}</div>`;
  }catch(err){ box.innerHTML='<div class="warn">'+esc(err.message)+'</div>'; }
}
async function doImport(btn){
  btn.disabled=true; btn.textContent='Importing…';
  const rows=IMPORT.map(({_dup,...r})=>r);
  for(let i=0;i<rows.length;i+=100){ const {error}=await S.sb.from('members').insert(rows.slice(i,i+100)); if(error){ toast(error.message,true); btn.disabled=false; return; } }
  toast(rows.length+' member(s) imported'); IMPORT=null; await loadData(); render();
}

/* ---- PALMS upload ---- */
let PALMS_UP=null;
async function onPalmsFile(e){
  const file=e.target.files[0]; if(!file) return;
  const box=$('#palmsPreview'); box.innerHTML='<span class="spin"></span>';
  try{
    const wb=await readSheet(file);
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
    const p=Palms.parsePalms(rows);
    if(p.errors.length) throw new Error(p.errors.join(' '));
    const span=daysBetween(p.from,p.to);
    // group rows by chapter (a Region report holds many chapters, a Chapter report holds one)
    const names=[...new Set(p.members.map(r=>r.chapter))];
    const unknown=names.filter(n=>!S.chapters.some(c=>Palms.norm(c.name)===Palms.norm(n)));
    const groups=S.chapters.filter(c=>names.some(n=>Palms.norm(n)===Palms.norm(c.name))).map(ch=>{
      const rowsCh=p.members.filter(r=>Palms.norm(r.chapter)===Palms.norm(ch.name));
      const pool=S.members.filter(m=>m.chapter_id===ch.id);
      const links=S.links.filter(l=>l.chapter_id===ch.id);
      rowsCh.forEach(r=>{ const mm=Palms.matchMember(r.palms_name, pool, links); r.member_id=mm?mm.member_id:null; r.how=mm?mm.how:null; });
      const matched=new Set(rowsCh.filter(r=>r.member_id).map(r=>r.member_id));
      const missing=pool.filter(m=>m.status==='active'&&!matched.has(m.id));
      return {ch, rows:rowsCh, missing};
    });
    if(!groups.length) throw new Error('None of the chapters in this file are in the app. Use the Chapter or Region Summary PALMS Report.');
    PALMS_UP={file:file.name, p, groups};
    const totalMatched=groups.reduce((a,g)=>a+g.rows.filter(r=>r.member_id).length,0);
    const totalMissing=groups.reduce((a,g)=>a+g.missing.length,0);
    box.innerHTML=`<div style="margin-top:10px">
      ${span>35?`<div class="warn">This file covers ${span+1} days (${fmtS(p.from)} to ${fmt(p.to)}). The Health Score only uses one-month files. Please export one calendar month.</div>`:''}
      ${unknown.length?`<div class="warn">Skipped (not one of the 14 chapters in the app): ${unknown.map(esc).join(', ')}</div>`:''}
      <p><b>${p.multi?'Region: '+esc(p.region||''):esc(groups[0].ch.name)}</b> · ${fmtS(p.from)} to ${fmt(p.to)} · ${groups.length} chapter(s) · ${p.members.length} members in file · <b>${totalMatched}</b> matched to first-year members${totalMissing?` · <span class="flag">${totalMissing} not found</span>`:''}</p>
      ${groups.filter(g=>g.missing.length).map(g=>`<div class="warn"><b>${esc(g.ch.name)}: ${g.missing.length} first-year member(s) not found.</b> Link them if their BNI Connect name is spelled differently:
        ${g.missing.map(m=>`<div class="row" style="margin-top:6px"><span class="grow">${esc(m.full_name)}</span>
          <select data-link="${m.id}" data-ch="${g.ch.id}" style="max-width:260px"><option value="">Not in this file</option>${g.rows.filter(r=>!r.member_id).map(r=>`<option value="${esc(r.palms_name)}">${esc(r.palms_name)}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}
      <button class="btn" data-act="savePalms" ${span>35?'disabled':''}>Save PALMS for ${groups.length} chapter(s)</button></div>`;
  }catch(err){ box.innerHTML='<div class="warn">'+esc(err.message)+'</div>'; PALMS_UP=null; }
}
async function savePalms(btn){
  if(!PALMS_UP) return; btn.disabled=true; btn.textContent='Saving…';
  const {p,file,groups}=PALMS_UP;
  try{
    const newLinks=[];
    document.querySelectorAll('select[data-link]').forEach(sel=>{ if(!sel.value) return;
      const mid=Number(sel.dataset.link), chId=Number(sel.dataset.ch);
      newLinks.push({chapter_id:chId, palms_name:sel.value, member_id:mid});
      const g=groups.find(x=>x.ch.id===chId); const r=g&&g.rows.find(x=>x.palms_name===sel.value); if(r){ r.member_id=mid; r.how='linked'; } });
    if(newLinks.length){ const {error}=await S.sb.from('palms_links').upsert(newLinks,{onConflict:'chapter_id,palms_name'}); if(error) throw error; }
    const gave=[], got=[];
    for(const g of groups){
      await S.sb.from('palms_uploads').delete().eq('chapter_id',g.ch.id).eq('period_from',p.from).eq('period_to',p.to);
      const {data:up,error:e1}=await S.sb.from('palms_uploads').insert({chapter_id:g.ch.id, period_from:p.from, period_to:p.to, file_name:file, uploaded_by:S.session.user.id}).select().single();
      if(e1) throw e1;
      const rows=g.rows.map(r=>({upload_id:up.id, chapter_id:g.ch.id, palms_name:r.palms_name, member_id:r.member_id||null, p:r.p,a:r.a,l:r.l,m:r.m,s:r.s,rgi:r.rgi,rgo:r.rgo,rri:r.rri,rro:r.rro,v:r.v,one2one:r.one2one,tyfcb:r.tyfcb,ceu:r.ceu}));
      for(let i=0;i<rows.length;i+=200){ const {error}=await S.sb.from('palms_rows').insert(rows.slice(i,i+200)); if(error) throw error; }
      g.rows.forEach(r=>{ if(!r.member_id) return; if(r.rgi+r.rgo>0) gave.push(r.member_id); if(r.rri+r.rro>0) got.push(r.member_id); });
    }
    const stamp={status:'done', done_by:'PALMS', done_on:p.to};
    for(let i=0;i<gave.length;i+=200) await S.sb.from('tasks').update(stamp).in('member_id',gave.slice(i,i+200)).eq('template_code','A19').eq('status','open');
    for(let i=0;i<got.length;i+=200) await S.sb.from('tasks').update(stamp).in('member_id',got.slice(i,i+200)).eq('template_code','A20').eq('status','open');
    toast('PALMS saved for '+groups.length+' chapter(s)'); PALMS_UP=null; await loadData(); render();
  }catch(err){ toast(err.message,true); btn.disabled=false; btn.textContent='Save PALMS'; }
}

    <select name="who_sel"><option value="">Choose…</option>${ppl.map(p=>`<option>${esc(p.name)}</option>`).join('')}${m.mentor_name&&!ppl.some(p=>p.name===m.mentor_name)?`<option>${esc(m.mentor_name)}</option>`:''}<option value="__other">Someone else (type name)</option></select>

    ${na?'':`<label class="f">Date</label><input type="date" name="done_on" value="${todayISO()}" max="${todayISO()}">`}
    ${!na&&tpl.needs_rating?`<label class="f">How does the member rate BNI so far? *</label>
      <div class="stars">${[1,2,3,4,5].map(i=>`<button type="button" data-star="${i}">${i}</button>`).join('')}</div><input type="hidden" name="rating">`:''}
    <label class="f">${na?'Reason *':(tpl.needs_note?'Note (one line) *':'Note (optional)')}</label>
    <textarea name="note" ${na||tpl.needs_note?'required':''}></textarea>
    <p class="small muted">${ppl.length?'':'Tip: add your chapter leaders in Settings so names appear in the list.'}</p>

  </form>`);
  const f=$('#doneForm');
  f.who_sel.onchange=()=>f.who_txt.classList.toggle('hidden', f.who_sel.value!=='__other');
  f.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{ f.querySelectorAll('[data-star]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); f.rating.value=b.dataset.star; });

async function submitDone(f){
  const id=Number(f.dataset.id), na=f.dataset.mode==='na';
  const who=f.who_sel.value==='__other'?f.who_txt.value.trim():f.who_sel.value;
  if(!who){ toast('Please choose who did it',true); return; }
  const upd={status:na?'na':'done', done_by:who, done_on:na?todayISO():(f.done_on.value||todayISO()), note:f.note.value.trim()||null};
  if(f.rating){ if(!f.rating.value){ toast('Please pick a rating from 1 to 5',true); return; } upd.rating=Number(f.rating.value); }
  const {error}=await S.sb.from('tasks').update(upd).eq('id',id);
  if(error){ toast(error.message,true); return; }
  Object.assign(S.tasks.find(t=>t.id===id), upd); index(); closeModal(); render(); toast(na?'Marked not applicable':'Done. Thank you!');
}

document.addEventListener('click', async (e)=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=Number(el.dataset.id);
  if(act==='closeModal'){ if(e.target===el) closeModal(); return; }
  e.preventDefault();
  if(act==='openMember'){ S.memberOpen=id; render(); }
  else if(act==='back'){ S.memberOpen=null; render(); }
  else if(act==='done') doneModal(id,'done');
  else if(act==='na') doneModal(id,'na');
  else if(act==='reopen'){ const upd={status:'open',done_by:null,done_on:null,rating:null}; const {error}=await S.sb.from('tasks').update(upd).eq('id',id); if(error) return toast(error.message,true); Object.assign(S.tasks.find(t=>t.id===id),upd); index(); render(); }
  else if(act==='toggleLater'){ S.filters.week.later=!S.filters.week.later; render(); }
  else if(act==='pickChapter'){ S.chapterSel=String(id); $('#chapterSel').value=S.chapterSel; sessionStorageSet('chSel',S.chapterSel); S.tab='dash'; render(); }
  else if(act==='logReview') reviewModal(el.dataset.month);
  else if(act==='delPerson'){ const {error}=await S.sb.from('chapter_people').delete().eq('id',id); if(error) return toast(error.message,true); S.people=S.people.filter(p=>p.id!==id); render(); }
  else if(act==='deleteMember'){ if(!confirm('Delete this member and all their tasks? This cannot be undone.')) return; const {error}=await S.sb.from('members').delete().eq('id',id); if(error) return toast(error.message,true); S.memberOpen=null; await loadData(); render(); toast('Member deleted'); }
  else if(act==='doImport') doImport(el);
  else if(act==='savePalms') savePalms(el);
  else if(act==='setpw'){ const pw=$('#pw_'+id).value.trim(); if(pw.length<8) return toast('Password must be at least 8 characters',true);
    el.disabled=true; try{ const r=await api('/api/admin-users',{action:'set_password',chapter_id:id,password:pw}); toast((r.created?'Login created for ':'Password reset for ')+r.login); adminAfterRender(); }catch(err){ toast(err.message,true); el.disabled=false; } }
  else if(act==='cron'){ const out=$('#cronOut'); out.textContent='Running…'; try{ const r=await api('/api/cron',{mode:el.dataset.mode, dry_run:!!el.dataset.dry}); out.textContent=JSON.stringify(r,null,2); }catch(err){ out.textContent='Error: '+err.message; } }
  else if(act==='export') exportCSV();
  else if(act==='toggleLive'){ const on=S.config.telegram_live==='true'; const first=!S.config.went_live_on; const today=todayISO();
    if(on){ if(!confirm('Pause all Telegram messages to chapter HT groups?')) return; }
    else if(!confirm(first
      ? 'GO LIVE today ('+fmt(today)+')?\n\n1. The journey clock restarts today: every open task is re-dated from '+fmt(today)+', so nothing is overdue on day one.\n2. Weekly lists (Mondays), red alerts and the monthly summary start going to all 14 HT groups.'
      : 'Resume Telegram messages to all 14 HT groups? (Due dates stay as they are.)')) return;
    el.disabled=true;
    if(!on && first){
      const {error:e1}=await S.sb.from('app_config').upsert([{key:'go_live_date',value:today},{key:'went_live_on',value:today}],{onConflict:'key'}); if(e1){ el.disabled=false; return toast(e1.message,true); }
      const {error:e2}=await S.sb.rpc('regen_all'); if(e2){ el.disabled=false; return toast('Could not re-date tasks: '+e2.message,true); }
    }
    const {error}=await S.sb.from('app_config').upsert({key:'telegram_live',value:on?'false':'true'},{onConflict:'key'}); if(error){ el.disabled=false; return toast(error.message,true); }
    await loadData(); render(); toast(on?'Telegram paused':(first?'LIVE from today. All due dates now start from '+fmt(today):'Telegram resumed')); }
  else if(act==='mentorMode'){ S.mentorMode=!S.mentorMode; render(); }
  else if(act==='saveMentors') saveMentors(el);
});
document.addEventListener('input', (e)=>{
  const f=e.target.dataset.f; if(!f) return; const [a,b]=f.split('.'); S.filters[a][b]=e.target.value;
  if(e.target.tagName==='SELECT') render(); else { clearTimeout(window._ft); window._ft=setTimeout(()=>{ const pos=e.target.selectionStart; render(); const el=document.querySelector(`[data-f="${f}"]`); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(x){} } },250); }
});
document.addEventListener('submit', async (e)=>{
  const f=e.target; if(!['memForm','personForm','addForm','doneForm','reviewForm','cfgForm'].includes(f.id)) return;
  e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries());
  const nul=(v)=>{ v=(v??'').trim(); return v===''?null:v; };
  if(f.id==='doneForm') return submitDone(f);
  if(f.id==='memForm'){
    const upd={mentor_name:nul(fd.mentor_name),mentor_mobile:nul(fd.mentor_mobile),power_team:nul(fd.power_team),mobile:nul(fd.mobile),payment_date:nul(fd.payment_date),induction_date:nul(fd.induction_date),notes:nul(fd.notes)};
    if(isAdmin()){ upd.status=fd.status; upd.status_reason=nul(fd.status_reason); }
    const {error}=await S.sb.from('members').update(upd).eq('id',Number(f.dataset.id));
    if(error) return toast(error.message,true);
    await loadData(); render(); toast('Saved');
  }
  if(f.id==='personForm'){
    const {data,error}=await S.sb.from('chapter_people').insert({chapter_id:Number(S.chapterSel),name:fd.name.trim(),role:fd.role}).select().single();
    if(error) return toast(error.code==='23505'?'That name is already in the list':error.message,true);
    S.people.push(data); render(); toast('Leader added');
  }
  if(f.id==='addForm'){
    const row={full_name:fd.full_name.trim(),chapter_id:Number(fd.chapter_id),category:nul(fd.category),company:nul(fd.company),mobile:nul(fd.mobile),payment_date:nul(fd.payment_date),induction_date:nul(fd.induction_date),mentor_name:nul(fd.mentor_name)};
    if(!row.payment_date&&!row.induction_date) return toast('Enter a payment date or an induction date',true);
    const {error}=await S.sb.from('members').insert(row);
    if(error) return toast(error.message,true);
    await loadData(); render(); toast('Member added with their journey');
  }
  if(f.id==='reviewForm'){
    const month=f.dataset.month, ch=Number(S.chapterSel);
    const {error}=await S.sb.from('sdc_reviews').upsert({chapter_id:ch,review_month:month,reviewed_by:fd.reviewed_by.trim(),notes:nul(fd.notes),completion_pct:monthCompletion(ch,month)},{onConflict:'chapter_id,review_month'});
    if(error) return toast(error.message,true);
    closeModal(); await loadData(); render(); toast('Review logged');
  }
  if(f.id==='cfgForm'){
    const cfg=[{key:'app_url',value:(fd.app_url||'').trim()},{key:'region_chat_id',value:(fd.region_chat_id||'').trim()}];
    const {error}=await S.sb.from('app_config').upsert(cfg,{onConflict:'key'}); if(error) return toast(error.message,true);
    for(const c of S.chapters){ const v=(fd['tg_'+c.id]||'').trim(); if(v!==(c.telegram_chat_id||'')){ const {error:e2}=await S.sb.from('chapters').update({telegram_chat_id:v||null}).eq('id',c.id); if(e2) return toast(e2.message,true); } }
    await loadData(); render(); toast('Settings saved');
  }
});

function exportCSV(){
  const q=(v)=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[['Chapter','Member','Status','Track','Induction','Mentor','Health','Task','Owner','Due','Task status','Done by','Done on','Rating','Note'].map(q).join(',')];
  for(const t of scoped(S.tasks)){ const m=S.memberById.get(t.member_id); if(!m) continue;
    lines.push([chName(m.chapter_id),m.full_name,m.status,track(m),m.induction_date,m.mentor_name,health(m).status,t.title,t.owner_role,t.due_date,t.status,t.done_by,t.done_on,t.rating,t.note].map(q).join(',')); }
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='journey-tasks-'+todayISO()+'.csv'; a.click();
}

boot();
</script>
</body>
